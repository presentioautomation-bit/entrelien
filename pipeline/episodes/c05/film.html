<body><div id="stage"></div>
<script src="file:///home/claude/prod/lib/engine.js"></script>

<script>
// Carnet n°5 — « Pourquoi certains célibataires veulent-ils trouver l'amour en 48 heures ? »
// Fil rouge : le sablier et le compte à rebours « 48 h » en ocre ; la liste des « pas ».
const Q=r=>s=>r.querySelector(s);
const G='color:var(--second)';
const hourglass=(cls,x,y,s,night)=>'<g class="'+cls+'" transform="translate('+x+' '+y+') scale('+s+')"><path d="M-110 -200 H110 M-110 200 H110" class="ink"/><path d="M-90 -200 Q-90 -60 0 0 Q-90 60 -90 200 M90 -200 Q90 -60 0 0 Q90 60 90 200" class="ink-thin" style="fill:'+(night?'#2B3754':'var(--paper2)')+'"/>'+
  '<path class="'+cls+'-top" d="M-70 -150 Q0 -120 70 -150 Q60 -60 0 -10 Q-60 -60 -70 -150 Z" style="fill:var(--accent)"/><path class="'+cls+'-bot" d="M-80 190 Q0 100 80 190 Z" style="fill:var(--accent)"/><path class="'+cls+'-str" d="M0 -10 V180" style="stroke:var(--accent);stroke-width:4;stroke-dasharray:6 8"/></g>';
const sand=(r,cls,p)=>{r.querySelector('.'+cls+'-top').setAttribute('transform','translate(0 '+(-150*(1-p)*0)+') scale(1 '+(1-p*.9).toFixed(3)+')');r.querySelector('.'+cls+'-top').style.transformOrigin='0 -10px';r.querySelector('.'+cls+'-bot').setAttribute('transform','translate(0 '+((1-p)*90).toFixed(1)+')')};

// 01 — Accroche, nuit : des années de célibat, un nouveau profil… « c'est pour quand ? »
sc('accroche',['01'],function(r){
  r.innerHTML='<div class="ground"><div class="night"></div><div class="cam ac-cam"><svg class="art night-art" viewBox="0 0 1920 1080"><g class="ac-boil">'+W.moon('ac-moon',1760,180,48)+W.tel('ac-t',1380,540,1.2,true,
    '<g class="ac-prof"><circle cx="0" cy="-110" r="50" style="fill:var(--nightlift)"/><path d="M-80 20 Q0 -60 80 20" style="fill:var(--nightlift)"/><path d="M-70 70 H70 M-70 110 H30" style="stroke:var(--ground);stroke-width:4;opacity:.5"/></g>')+'</g></svg>'+
    '<p class="note ac-48" style="left:1600px;top:300px;font-size:110px;color:var(--accent)">48 h</p></div>'+pool(1100,180,700,760,'ac-pool')+
    '<div class="words on-night" style="left:160px;top:260px;width:860px"><p class="sub ac-sub">Des années de célibat. Puis un nouveau profil, quelques photos.</p><h1 class="line ac-line" style="font-size:76px">« Alors… c’est pour quand ? »</h1></div></div>';
  const q=Q(r);this.cam=q('.ac-cam');this.boil=q('.ac-boil');this.t=q('.ac-t');this.moon=q('.ac-moon');this.pr=q('.ac-prof');this.n=q('.ac-48');this.sub=q('.ac-sub');this.line=split(q('.ac-line'));this.pool=q('.ac-pool');
},function(t){const P=this.P;push(this.cam,t,this.dur,1,1.05,1380,540);W.boil(this.boil,t);show(this.t,t,.1,.8);show(this.moon,t,.4,1.2);show(this.pr,t,P(1),.6);fade(this.n,t,P(2),.5,0);
  fade(this.sub,t,P(0),.7);wordsIn(this.line,t,P(2)+1.2,.12);this.pool.style.opacity=(.3+.05*Math.sin(t*1.2))*eo(seg(t,.4,1.6))},{night:true});

// 02 — Titre : le sablier.
sc('titre',['02'],function(r){
  r.innerHTML='<div class="ground"><div class="cam ti-cam"><svg class="art" viewBox="0 0 1920 1080">'+W.page('ti')+'<g class="ti-boil">'+hourglass('ti-h',1440,520,1.2)+'</g></svg></div>'+
    pool(900,100,1100,900,'ti-pool')+'<div class="edge"></div>'+
    '<div class="words" style="left:260px;top:280px;width:780px"><p class="hand ti-num">Carnet n°5</p><h1 class="line ti-line" style="font-size:70px">Pourquoi certains célibataires veulent-ils trouver l’amour en 48 heures ?</h1></div></div>';
  const q=Q(r);this.r=r;this.cam=q('.ti-cam');this.boil=q('.ti-boil');this.h=q('.ti-h');this.num=q('.ti-num');this.line=split(q('.ti-line'));this.pool=q('.ti-pool');
},function(t){push(this.cam,t,this.dur,1,1.035,1440,520);W.boil(this.boil,t);show(this.h,t,.1,.7);sand(this.r,'ti-h',seg(t,0,this.dur));
  fade(this.num,t,this.P(0),.5);wordsIn(this.line,t,this.P(0)+1,.08);this.pool.style.opacity=.85+.1*Math.sin(t)});

// 03 — Un nouveau départ, un espoir immense… devenu attente.
sc('espoir',['03'],function(r){
  r.innerHTML='<div class="ground"><div class="cam es-cam"><svg class="art" viewBox="0 0 1920 1080">'+W.page('es')+'<g class="es-boil">'+W.ground(930,980,1800,0)+W.figure('es-m',1220,926,1.05,false)+
    W.heart('es-h',1220,420,1.1)+W.dial('es-d',1620,520,130)+'</g></svg>'+note('es-n',1080,250,'cette fois, ce sera la bonne',';color:var(--accent);font-size:46px')+note('es-n2',1520,700,'tout de suite',G+';font-size:46px')+'</div>'+
    pool(800,0,1100,1000,'es-pool')+'<div class="edge"></div>'+
    '<div class="words" style="left:230px;top:260px;width:600px"><p class="sub es-sub">Quelqu’un, célibataire depuis longtemps, recommence à chercher.</p><h2 class="line es-line" style="font-size:60px">Le problème, c’est quand l’espoir devient une attente immédiate.</h2></div></div>';
  const q=Q(r);this.r=r;this.cam=q('.es-cam');this.st=W.prep(r);this.boil=q('.es-boil');this.m=q('.es-m');this.h=q('.es-h');this.d=q('.es-d');this.n=q('.es-n');this.n2=q('.es-n2');this.sub=q('.es-sub');this.line=split(q('.es-line'));this.pool=q('.es-pool');
},function(t){const P=this.P;push(this.cam,t,this.dur,1,1.04,1400,600);W.draw(this.st,t);W.boil(this.boil,t);show(this.m,t,.2,.8);show(this.h,t,P(2),.5);fade(this.n,t,P(2)+.6,.5,0);
  show(this.d,t,P(3),.5);const m=t*90;W.hands(this.r,'es-d',1620,520,m/60,m%60);fade(this.n2,t,P(3)+.8,.5,0);fade(this.sub,t,P(1),.6);wordsIn(this.line,t,P(3),.08);this.pool.style.opacity=.85+.1*Math.sin(t)});

// 04 — Une rencontre n'est pas une commande : les étapes, et le temps.
sc('etapes',['04'],function(r){
  const steps=['quelqu’un est là','intéressé en retour','les échanges fonctionnent','on finit par se voir'];
  r.innerHTML='<div class="ground"><div class="cam et-cam"><svg class="art" viewBox="0 0 1920 1080">'+W.page('et')+'<g class="et-boil">'+
    steps.map((s,i)=>'<g class="et-s'+i+'"><circle cx="1060" cy="'+(300+i*130)+'" r="34" style="fill:var(--paper2);stroke:var(--main);stroke-width:3"/>'+TXT('',1060,312+i*130,34,String(i+1),'var(--main)','middle','Fraunces,Georgia,serif')+TXT('',1120,312+i*130,38,s,'var(--main)','start')+(i<3?'<path class="ink-thin" d="M1060 '+(334+i*130)+' V'+(396+i*130)+'"/>':'')+'</g>').join('')+
    hourglass('et-h',1700,520,.7)+'</g></svg>'+note('et-n',1600,760,'du temps',';color:var(--accent);font-size:46px')+'</div>'+
    pool(800,0,1100,1000,'et-pool')+'<div class="edge"></div>'+
    '<div class="words" style="left:230px;top:260px;width:600px"><h2 class="line et-line" style="font-size:60px">Une rencontre n’est pas une commande passée sur Internet.</h2><p class="hand et-hand">et une part d’incertitude.</p></div></div>';
  const q=Q(r);this.r=r;this.cam=q('.et-cam');this.boil=q('.et-boil');this.s=[0,1,2,3].map(i=>q('.et-s'+i));this.h=q('.et-h');this.n=q('.et-n');this.line=split(q('.et-line'));this.hand=q('.et-hand');this.pool=q('.et-pool');
},function(t){const P=this.P;push(this.cam,t,this.dur,1,1.035,1400,520);W.boil(this.boil,t);this.s.forEach((s,i)=>show(s,t,P(1+i),.4));show(this.h,t,P(5),.5);sand(this.r,'et-h',seg(t,P(5),this.dur));fade(this.n,t,P(5)+.4,.5,0);
  wordsIn(this.line,t,P(0),.08);fade(this.hand,t,P(6),.5);this.pool.style.opacity=.85+.1*Math.sin(t)});

// 05 — Une liste se prépare.
sc('liste',['05'],function(r){
  r.innerHTML='<div class="ground"><div class="cam li-cam"><svg class="art" viewBox="0 0 1920 1080">'+W.page('li')+'<g class="li-boil">'+
    '<g transform="rotate(-3 1400 540)"><rect x="1150" y="200" width="500" height="660" rx="10" style="fill:var(--paper2)"/><rect class="ink-thin" x="1150" y="200" width="500" height="660" rx="10"/>'+
    [0,1,2,3,4,5,6].map(i=>'<path class="pencil" d="M1190 '+(300+i*80)+' H1610"/>').join('')+'</g>'+
    '<g class="li-pen" transform="translate(1560 470) rotate(35)"><rect x="-12" y="-150" width="24" height="170" rx="6" style="fill:var(--main)"/><path d="M-12 20 L0 50 L12 20 Z" style="fill:var(--accent)"/></g></g></svg>'+
    note('li-t',1200,220,'ce que je ne peux pas accepter',';color:var(--main);font-size:42px;transform:rotate(-3deg)')+'</div>'+
    pool(800,0,1100,1000,'li-pool')+'<div class="edge"></div>'+
    '<div class="words" style="left:230px;top:260px;width:600px"><p class="sub li-sub">Et puis il y a autre chose.</p><h2 class="line li-line" style="font-size:60px">Elle savait très précisément ce qu’elle ne pouvait pas accepter.</h2></div></div>';
  const q=Q(r);this.cam=q('.li-cam');this.boil=q('.li-boil');this.pen=q('.li-pen');this.tt=q('.li-t');this.sub=q('.li-sub');this.line=split(q('.li-line'));this.pool=q('.li-pool');
},function(t){const P=this.P;push(this.cam,t,this.dur,1,1.04,1400,520);W.boil(this.boil,t);show(this.boil,t,.2,.6);fade(this.tt,t,P(1)+1,.6,0);this.pen.setAttribute('transform','translate('+(1560+Math.sin(t*6)*30).toFixed(1)+' '+(470+((t*40)%160)).toFixed(1)+') rotate(35)');
  fade(this.sub,t,P(0),.6);wordsIn(this.line,t,P(1),.08);this.pool.style.opacity=.85+.1*Math.sin(t)});

// 06 — La bascule, nuit : « Pas chauve. Pas de bridge… »
sc('pas',['06'],function(r){
  const L=['Pas chauve.','Pas de bridge.','Pas certains travaux dentaires.','Pas ceci.','Pas cela.'];
  r.innerHTML='<div class="ground"><div class="night"></div><div class="cam pa-cam">'+
    L.map((s,i)=>'<p class="pa-l'+i+'" style="position:absolute;margin:0;left:'+(200+i*70)+'px;top:'+(200+i*130)+'px;font-family:Fraunces,Georgia,serif;font-size:'+(i<3?86:70)+'px;color:'+(i===4?'var(--accent)':'var(--ground)')+';opacity:0">'+s+'</p>').join('')+'</div>'+pool(500,150,1000,800,'pa-pool')+'</div>';
  const q=Q(r);this.cam=q('.pa-cam');this.l=[0,1,2,3,4].map(i=>q('.pa-l'+i));this.pool=q('.pa-pool');
},function(t){const P=this.P;push(this.cam,t,this.dur,1,1.05,900,540);this.l.forEach((l,i)=>fade(l,t,P(i),.35,0));this.pool.style.opacity=(.2+.3*eo(seg(t,P(0),P(0)+1)))*(.92+.08*Math.sin(t*1.3))},{night:true,lead:1.5});

// 07 — Décodage (sauge) : l'entonnoir des critères.
sc('entonnoir',['07'],function(r){
  r.innerHTML='<div class="ground"><div class="cam en-cam"><svg class="art" viewBox="0 0 1920 1080">'+W.page('en')+'<g class="en-boil">'+
    '<path class="ink" d="M1060 260 H1740 L1450 640 V820 H1350 V640 Z" style="fill:var(--paper2)"/>'+[0,1,2,3].map(i=>'<path class="en-f'+i+'" d="M'+(1110+i*55)+' '+(330+i*80)+' H'+(1690-i*55)+'" style="stroke:var(--sage);stroke-width:5;stroke-dasharray:16 10"/>').join('')+
    '<g class="en-ppl">'+[0,1,2,3,4,5,6,7].map(i=>'<g class="en-p'+i+'" transform="translate('+(1120+i*80)+' 230) scale(.14)"><circle cy="-362" r="38" style="fill:var(--wash2)"/><path d="M-34 0 L-30 -150 Q-48 -160 -56 -250 Q-58 -300 -20 -318 L20 -318 Q58 -300 56 -250 Q48 -160 30 -150 L34 0 Z" style="fill:var(--wash2)"/></g>').join('')+'</g>'+
    '<circle class="en-out" cx="1400" cy="900" r="22" style="fill:none;stroke:var(--accent);stroke-width:4;stroke-dasharray:6 6"/></g></svg>'+note('en-n',1470,870,'une personne réelle ?',';color:var(--accent);font-size:44px')+'</div>'+
    pool(800,0,1100,1000,'en-pool')+'<div class="edge"></div>'+
    '<div class="words" style="left:230px;top:240px;width:600px"><p class="sub en-sub">Pris un par un, aucun de ces critères n’est choquant.</p><h2 class="line en-line" style="font-size:56px;color:var(--sage)">Est-ce que je laisse encore une place à une personne réelle ?</h2></div></div>';
  const q=Q(r);this.cam=q('.en-cam');this.boil=q('.en-boil');this.f=[0,1,2,3].map(i=>q('.en-f'+i));this.p=[0,1,2,3,4,5,6,7].map(i=>q('.en-p'+i));this.out=q('.en-out');this.n=q('.en-n');this.sub=q('.en-sub');this.line=split(q('.en-line'));this.pool=q('.en-pool');
},function(t){const P=this.P;push(this.cam,t,this.dur,1,1.035,1400,540);W.boil(this.boil,t);show(this.boil,t,.1,.6);
  this.f.forEach((f,i)=>show(f,t,P(2)+i*.5,.4));this.p.forEach((p,i)=>{p.style.opacity=1-eo(seg(t,P(2)+.5+i*.35,P(2)+.9+i*.35))});show(this.out,t,P(4),.5);fade(this.n,t,P(4)+.5,.5,0);
  fade(this.sub,t,P(0),.6);wordsIn(this.line,t,P(4),.08);this.pool.style.opacity=.85+.1*Math.sin(t)});

// 08 — Une personne réelle n'est jamais une liste.
sc('reelle',['08'],function(r){
  r.innerHTML='<div class="ground"><div class="cam re-cam"><svg class="art" viewBox="0 0 1920 1080">'+W.page('re')+'<g class="re-boil">'+W.ground(930,1000,1800,0)+W.figure('re-m',1400,926,1.15,false)+
    '<path class="re-l1 pencil" d="M1440 480 L1560 380"/><path class="re-l2 pencil" d="M1400 470 L1260 330"/><path class="re-l3 pencil" d="M1450 650 L1600 640"/><path class="re-l4 pencil" d="M1380 520 L1200 560"/></g></svg>'+
    note('re-a',1560,330,'de beaux yeux',';color:var(--sage);font-size:44px')+note('re-b',1060,280,'moins de cheveux que prévu',';color:var(--accent);font-size:42px')+
    note('re-c',1610,610,'drôle, attentionné',';color:var(--sage);font-size:44px')+note('re-d',1040,540,'un bridge',';color:var(--accent);font-size:44px')+'</div>'+
    pool(800,0,1100,1000,'re-pool')+'<div class="edge"></div>'+
    '<div class="words" style="left:230px;top:260px;width:560px"><h2 class="line re-line" style="font-size:62px">Une personne réelle n’est jamais une liste.</h2></div></div>';
  const q=Q(r);this.cam=q('.re-cam');this.st=W.prep(r);this.boil=q('.re-boil');this.m=q('.re-m');this.l=[1,2,3,4].map(i=>q('.re-l'+i));this.n=['a','b','c','d'].map(i=>q('.re-'+i));this.line=split(q('.re-line'));this.pool=q('.re-pool');
},function(t){const P=this.P;push(this.cam,t,this.dur,1,1.04,1400,560);W.draw(this.st,t);W.boil(this.boil,t);show(this.m,t,.2,.8);[1,2,3,4].forEach((k,i)=>{show(this.l[i],t,P(k),.4);fade(this.n[i],t,P(k)+.2,.5,0)});
  wordsIn(this.line,t,P(0),.09);this.pool.style.opacity=.85+.1*Math.sin(t)});

// 09 — Changer d'application ne change pas le regard.
sc('applis',['09'],function(r){
  r.innerHTML='<div class="ground"><div class="cam ap-cam"><svg class="art" viewBox="0 0 1920 1080">'+W.page('ap')+'<g class="ap-boil">'+
    [0,1,2].map(i=>'<g class="ap-t'+i+'">'+W.tel('',1100+i*270,520,.75,false,'<rect x="-80" y="-150" width="160" height="220" rx="8" style="fill:var(--paper2);stroke:var(--accent);stroke-width:3"/><path d="M-60 -110 H60 M-60 -70 H60 M-60 -30 H40 M-60 10 H50" style="stroke:var(--accent);stroke-width:4;stroke-linecap:round"/>')+'</g>').join('')+'</g></svg>'+
    note('ap-n',1060,800,'les mêmes critères… les mêmes résultats',';color:var(--accent);font-size:44px')+'</div>'+
    pool(800,0,1100,1000,'ap-pool')+'<div class="edge"></div>'+
    '<div class="words" style="left:230px;top:260px;width:600px"><p class="sub ap-sub">On se dit que les applications ne fonctionnent pas. C’est parfois vrai.</p><h2 class="line ap-line" style="font-size:58px">Mais changer d’application ne change pas notre regard.</h2></div></div>';
  const q=Q(r);this.cam=q('.ap-cam');this.boil=q('.ap-boil');this.tt=[0,1,2].map(i=>q('.ap-t'+i));this.n=q('.ap-n');this.sub=q('.ap-sub');this.line=split(q('.ap-line'));this.pool=q('.ap-pool');
},function(t){const P=this.P;push(this.cam,t,this.dur,1,1.035,1370,540);W.boil(this.boil,t);this.tt.forEach((x,i)=>show(x,t,P(0)+.4+i*.8,.5));fade(this.n,t,P(3),.5,0);
  fade(this.sub,t,P(0),.6);wordsIn(this.line,t,P(2),.08);this.pool.style.opacity=.85+.1*Math.sin(t)});

// 10 — Le tableau de bord de l'impatience.
sc('tableau',['10'],function(r){
  r.innerHTML='<div class="ground"><div class="cam tb-cam"><svg class="art" viewBox="0 0 1920 1080">'+W.page('tb')+'<g class="tb-boil">'+
    '<rect x="1020" y="230" width="760" height="520" rx="16" style="fill:var(--paper2)"/><rect class="ink-thin" x="1020" y="230" width="760" height="520" rx="16"/>'+
    '<g class="tb-g"><path class="ink-thin" d="M1110 520 A140 140 0 0 1 1390 520"/><path class="tb-needle" d="M1250 520 L1250 400" style="stroke:var(--accent);stroke-width:6;stroke-linecap:round"/>'+TXT('',1250,580,32,'messages reçus','var(--second)')+'</g>'+
    '<g class="tb-b"><path class="ink-thin" d="M1560 300 Q1600 300 1604 360 L1610 420 L1630 440 H1490 L1510 420 L1516 360 Q1520 300 1560 300 Z" style="fill:var(--ground)"/><circle cx="1610" cy="310" r="26" style="fill:var(--accent)"/>'+TXT('',1610,320,30,'0','var(--night)')+'</g>'+
    TXT('tb-q1',1400,650,36,'Pourquoi personne ne m’a écrit ?','var(--main)')+TXT('tb-q2',1400,710,36,'Pourquoi ça ne va pas plus vite ?','var(--main)')+'</g></svg></div>'+
    pool(800,0,1100,1000,'tb-pool')+'<div class="edge"></div>'+
    '<div class="words" style="left:230px;top:260px;width:600px"><p class="sub tb-sub">L’impatience ajoute sa pression.</p><h2 class="line tb-line" style="font-size:58px">À force de surveiller le résultat, on oublie la rencontre.</h2></div></div>';
  const q=Q(r);this.cam=q('.tb-cam');this.boil=q('.tb-boil');this.g=q('.tb-g');this.nd=q('.tb-needle');this.b=q('.tb-b');this.q1=q('.tb-q1');this.q2=q('.tb-q2');this.sub=q('.tb-sub');this.line=split(q('.tb-line'));this.pool=q('.tb-pool');
},function(t){const P=this.P;push(this.cam,t,this.dur,1,1.035,1400,480);W.boil(this.boil,t);show(this.boil,t,.1,.5);this.nd.setAttribute('transform','rotate('+(-70+6*Math.sin(t*3)).toFixed(1)+' 1250 520)');

// 11 — Ce qui ne se voit pas sur un profil (sauge).

  const Wd=['la douceur','l’humour','la fiabilité','la générosité'];
  r.innerHTML='<div class="ground"><div class="cam qa-cam"><svg class="art" viewBox="0 0 1920 1080">'+W.page('qa')+'<g class="qa-boil">'+W.ground(930,1000,1800,0)+W.figure('qa-m',1200,926,1,false)+W.woman('qa-w',1600,926,1,true)+'</g></svg>'+
    Wd.map((s,i)=>note('qa-w'+i,1120+(i%2)*330,260+Math.floor(i/2)*110,s,';color:var(--sage);font-size:52px')).join('')+'</div>'+
    pool(800,0,1100,1000,'qa-pool')+'<div class="edge"></div>'+
    '<div class="words" style="left:230px;top:260px;width:600px"><p class="sub qa-sub">Ça ne se voit presque jamais dans les premières secondes d’un profil.</p><h2 class="line qa-line" style="font-size:60px;color:var(--sage)">Il faut souvent rencontrer quelqu’un pour le découvrir.</h2></div></div>';
  const q=Q(r);this.cam=q('.qa-cam');this.st=W.prep(r);this.boil=q('.qa-boil');this.m=q('.qa-m');this.w=q('.qa-w');this.wd=[0,1,2,3].map(i=>q('.qa-w'+i));this.sub=q('.qa-sub');this.line=split(q('.qa-line'));this.pool=q('.qa-pool');
},function(t){const P=this.P;push(this.cam,t,this.dur,1,1.04,1400,560);W.draw(this.st,t);W.boil(this.boil,t);show(this.m,t,.2,.7);show(this.w,t,.4,.7);this.wd.forEach((w,i)=>fade(w,t,P(0)+i*.7,.5,0));
  fade(this.sub,t,P(1),.6);wordsIn(this.line,t,P(2),.08);this.pool.style.opacity=.85+.1*Math.sin(t)});

// 12 — La fin : laisser du temps pour être surpris. Entrelien.
sc('fin',['12'],function(r){
  r.innerHTML='<div class="ground"><div class="cam fi-cam"><svg class="art" viewBox="0 0 1920 1080">'+W.page('fi')+'<g class="fi-boil">'+hourglass('fi-h',1480,470,.9)+W.heart('fi-hh',1480,800,.9)+'</g></svg></div>'+
    pool(1000,150,800,700,'fi-pool')+'<div class="edge"></div>'+
    '<div class="words" style="left:260px;top:200px;width:820px"><p class="hand fi-a">Pas rencontrer plus vite.</p><h2 class="line fi-line" style="font-size:62px">Laisser assez de temps à quelqu’un… pour nous surprendre.</h2></div>'+
    '<div class="words" style="left:260px;bottom:140px;width:900px;gap:8px"><p class="line fi-name" style="font-size:124px;font-weight:500">Entrelien</p><p class="sub fi-tag">Les Carnets de l’Entremetteur</p></div></div>';
  const q=Q(r);this.r=r;this.cam=q('.fi-cam');this.boil=q('.fi-boil');this.h=q('.fi-h');this.hh=q('.fi-hh');this.a=q('.fi-a');this.line=split(q('.fi-line'));this.name=q('.fi-name');this.tag=q('.fi-tag');this.pool=q('.fi-pool');
},function(t){const P=this.P;push(this.cam,t,this.dur,1.03,1,1480,520);W.boil(this.boil,t);show(this.h,t,.1,.7);sand(this.r,'fi-h',seg(t,0,P(2)));show(this.hh,t,P(2),.6);
  fade(this.a,t,P(0),.6);wordsIn(this.line,t,P(1),.09);fade(this.name,t,P(3)+.2,.8,20);fade(this.tag,t,P(3)+.7,.6);this.pool.style.opacity=.75+.1*Math.sin(t)});

startFilm();
